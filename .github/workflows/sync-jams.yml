name: Sync itch.io jams

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours, off the top of the hour
  workflow_dispatch:

concurrency:
  group: sync-jams
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sync:jams
        env:
          SYNC_URL: ${{ vars.SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
